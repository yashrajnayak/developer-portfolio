name: Bug report
description: Report a reproducible problem in the generator or rendered portfolio.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Use private vulnerability reporting instead.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v2.0.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Configuration, Build, Generated HTML, Accessibility, GitHub Actions, Documentation]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest safe config or repository link that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation output
      description: Paste relevant output from npm run validate:all.
